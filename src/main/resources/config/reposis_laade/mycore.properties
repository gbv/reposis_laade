# name of project - laade
MCR.NameOfProject=laade
MIR.projectid.default=laade
MCR.CLI.Classes.External=%MCR.CLI.Classes.External%,org.mycore.mir.laade.MIRLaadeImport


# supported languages
MCR.Metadata.Languages=de,en
# Layout
MIR.CustomLayout.JS=laade.js


MCR.ContentTransformer.mycoreobject-podcast.Stylesheet=xsl/mycoreobject-podcast.xsl
MCR.ContentTransformer.mir-admindata-box.Stylesheet=xsl/metadata/static/mir-admindata-box-static.xsl
MCR.IIIFImage.thumbnail.Derivate.Types=derivate_types:cover


##############################################################################
#                                                                            #
# reset new Metadata Layout                                                  #
#                                                                            #
##############################################################################
  MCR.ContentTransformer.mycoreobject-modsmeta.Stylesheet=%MCR.ContentTransformer.mycoreobject-rights.Stylesheet%,xsl/metadata/mods-metadata.xsl
  MCR.ContentTransformer.mycoreobject.Stylesheet=%MCR.ContentTransformer.mycoreobject-modsmeta.Stylesheet%,xsl/metadata/mods-metadata-page.xsl,%MCR.LayoutTransformerFactory.Default.Stylesheets%
  MCR.ContentTransformer.response-browse.Stylesheet=xsl/response2mycoreobject.xsl,%MCR.ContentTransformer.mycoreobject.Stylesheet%
  MCR.ContentTransformer.mycoreobject.Class=
  MCR.Jersey.Resource.Packages=%MCR.Jersey.Resource.Packages%,org.mycore.wavesurfer.prerender.resources
  MCR.Wavesurfer.MimeType=audio/mpeg,audio/mp3,audio/wav,audio/x-midi,audio/mp4,audio/ogg


# use laade specific layout stylesheets
  MCR.URIResolver.xslImports.modsmeta=metadata/mods-metadata-base.xsl,metadata/mir-browse.xsl,metadata/mir-breadcrumbs.xsl,metadata/mir-metadata-box.xsl,metadata/mir-admindata-box.xsl,metadata/mir-abstract.xsl,metadata/mir-collapse-files.xsl,metadata/laade-track-list.xsl,metadata/laade-player.xsl,metadata/laade-gallery.xsl,metadata/mir-file-upload.xsl,metadata/mir-edit.xsl,metadata/mir-share.xsl,%MIR.AVPlayer.Stylesheet%,metadata/mir-viewer.xsl,metadata/mir-citation.xsl,metadata/mir-export.xsl,metadata/mir-history.xsl,metadata/mir-epusta.xsl
  MCR.BatchEditor.BaseLevel.object=/mycoreobject
  MCR.BatchEditor.BaseLevel.publication=/mycoreobject/metadata/def.modsContainer/modsContainer/mods:mods

  MCR.BatchEditor.rights.Path2Remove=mods:accessCondition[@type="use and reproduction"][@xlink:href="http://www.mycore.org/classifications/mir_licenses#{0}"]
  MCR.BatchEditor.rights.Path2Add=mods:accessCondition[@type="use and reproduction"][@xlink:type="simple"][@xlink:href="http://www.mycore.org/classifications/mir_licenses#{0}"]